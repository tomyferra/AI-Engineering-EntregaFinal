# Stack completo con un solo comando:  docker compose up -d --build   (o ./run.sh)
#
#   redis   -> Redis Stack: jobs, cola, conversaciones y checkpoints de LangGraph (AOF: sobrevive reinicios)
#   phoenix -> Arize Phoenix: UI de trazas en http://localhost:6006 (colector OTLP)
#   api     -> FastAPI en http://localhost:8000/docs (solo encola y consulta; no ejecuta el grafo)
#   worker  -> consume la cola y ejecuta el grafo multi-agente (RAG en Pinecone, LLM, checkpointer)
services:
  redis:
    # El checkpointer de LangGraph (AsyncRedisSaver) necesita los módulos RedisJSON y RediSearch.
    image: redis/redis-stack-server:7.4.0-v6
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    ports:
      - "6006:6006"   # UI + colector OTLP/HTTP (/v1/traces)
    volumes:
      - phoenix-data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      RUN_WORKER_IN_API: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

volumes:
  redis-data:
  phoenix-data:
